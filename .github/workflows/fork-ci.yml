# Fork-only, never upstream: the one workflow meant to run here, and only when dispatched by hand.
# Upstream's workflows stay disabled on this fork, so no push, PR or issue starts anything.
#   gh workflow run fork-ci.yml --repo mareklangiewicz/Hyprland --ref main -f ref=<branch> -f what=quick
#
# what=quick  compile + unit tests + format, with ccache: the iteration loop.
# what=test   hyprtester in the Nix VM, ~40 min: Nix rebuilds all of Hyprland on any source change, so
#             caching cannot speed it up. Run it to prove a result, not on every change.
name: Fork CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to check
        required: true
        type: string
      what:
        description: Which checks to run
        required: true
        default: quick
        type: choice
        options: [quick, test, format, all]

permissions:
  contents: read

jobs:
  test:
    if: inputs.what == 'test' || inputs.what == 'all'
    name: hyprtester + gtests (Nix VM)
    runs-on: ubuntu-latest
    steps:
      - uses: hyprwm/actions/nix-setup@main

      - name: Run test VM
        env:
          REF: ${{ inputs.ref }}
        run: nix build "github:${{ github.repository }}?ref=$REF#checks.x86_64-linux.tests" -L --extra-substituters "https://hyprland.cachix.org"

      - name: Check exit status
        run: |
          grep 0 result/exit_status || echo "hyprtester failed"
          grep 0 result/exit_status_gtests || echo "gtests failed"
          [ 0 = $(cat result/exit_status) ] && [ 0 = $(cat result/exit_status_gtests) ]

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: result

  quick:
    if: inputs.what == 'quick' || inputs.what == 'all'
    name: build + gtests (ccache)
    runs-on: ubuntu-latest
    container:
      image: archlinux
    env:
      CCACHE_DIR: /github/home/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 3G
      # the compiler is reinstalled every run, and protocol headers are regenerated: hash content, not times
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
    steps:
      - name: Checkout repository actions
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - name: Setup base
        uses: ./.github/actions/setup_base

      - name: Install ccache
        run: pacman --noconfirm --noprogressbar -Sy ccache

      # setup_base checks out the dispatched ref, which is main
      - name: Checkout the ref to check
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /github/home/.ccache
          key: ccache-arch-${{ github.run_id }}
          restore-keys: ccache-arch-

      # only in this throwaway checkout: ccache can't cache --coverage, which is ~600 of ~730 compile calls
      - name: Drop coverage instrumentation
        run: sed -i '/--coverage/d' CMakeLists.txt

      - name: Build
        run: |
          cmake -Wno-dev -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTESTS=true \
            -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j"$(nproc)"

      - name: ccache stats
        if: always()
        run: ccache -sv

      # saved on failure too: a failed build still warms the cache for the next try
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /github/home/.ccache
          key: ccache-arch-${{ github.run_id }}

      - name: Unit tests
        run: ./build/hyprland_gtests

  format:
    if: inputs.what != 'test'
    name: clang-format
    runs-on: ubuntu-latest
    container:
      image: archlinux
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install clang-format
        run: |
          pacman --noconfirm --noprogressbar -Syyu
          pacman --noconfirm --noprogressbar -Sy clang

      - name: clang-format check
        run: .github/workflows/clang-format-check.sh "." "llvm" "^subprojects$" ""
